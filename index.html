<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f7" />
    <meta
      name="description"
      content="Patungan Yuu: bagi bill bareng tanpa drama. Klaim item, atur ongkir, diskon, service, pajak, dan lihat total tiap orang."
    />
    <title>Patungan Yuu</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=ranade@1&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('patungan:preferences')
          var prefs = raw ? JSON.parse(raw) : {}
          var systemDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme =
            prefs.theme === 'dark' || prefs.theme === 'light'
              ? prefs.theme
              : systemDark
                ? 'dark'
                : 'light'
          var language = prefs.language === 'en' ? 'en' : 'id'
          var root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          root.dataset.theme = theme
          root.lang = language
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute(
              'content',
              theme === 'dark' ? '#0f0f0f' : '#f7f7f7',
            )
          }
          document.title =
            language === 'en'
              ? 'Patungan Yuu — Split bills without drama'
              : 'Patungan Yuu — Bagi bill tanpa drama'
        } catch (error) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
